# Dogfood: this repo runs its own action, so a change to the action is exercised
# against real traffic before it is relied on elsewhere.
#
# Requires an ANYROUTER_API_KEY repository secret.

name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  # Mention-driven interactive session, unchanged.
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      # The wrapped action exchanges a GitHub OIDC token for a GitHub App token
      # on every run, and fails without this.
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: duyet/claude-anyrouter-action@main
        with:
          anyrouter_api_key: ${{ secrets.ANYROUTER_API_KEY }}

          # Lets Claude read the test results of this repo's own runs.
          additional_permissions: |
            actions: read

  # Unattended review: every PR gets reviewed without waiting for an @claude.
  auto-review:
    # The workflow also fires on comment events, so scope the job to PRs.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      # The action's own token is the app token above, so these scope
      # GITHUB_TOKEN and the checkout, not what Claude can do.
      contents: read
      pull-requests: read
      # Required: the action mints a GitHub App token via OIDC every run.
      id-token: write
    # Pushes re-trigger `synchronize`; a superseded review is wasted spend.
    concurrency:
      group: claude-auto-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Review
        uses: duyet/claude-anyrouter-action@main
        with:
          anyrouter_api_key: ${{ secrets.ANYROUTER_API_KEY }}

          # Supplies the review prompt, the turn limit, and `actions: read`.
          preset: review

          # TEMP DIAGNOSTIC - revert
          show_full_output: "true"
