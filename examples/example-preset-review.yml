# Automated pull request review using the review preset.
#
# The preset supplies the review prompt, the turn limit, and `actions: read`, so
# this is the shortest useful workflow in the repo.
#
# The review body is attacker-controlled, so the job keeps `contents: read` and
# `pull-requests: read`. Note that these scope GITHUB_TOKEN and the checkout,
# not Claude itself: the action exchanges an OIDC token for a GitHub App token
# whose real scope comes from that app's installation permissions on the repo.
# To stop Claude from writing at all, narrow the app's installation.
#
# `id-token: write` is what makes the action run. Without it the OIDC exchange
# fails and the job errors out.

name: Claude PR Review (AnyRouter, preset)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Review
        uses: duyet/claude-anyrouter-action@main
        with:
          anyrouter_api_key: ${{ secrets.ANYROUTER_API_KEY }}
          preset: review

          # A preset only fills inputs left empty, so overriding the prompt here
          # narrows the review without giving up the preset's turn limit.
          # prompt: |
          #   Review only the database migrations in src/db.
          #   Report anything that could lock or lose data.
